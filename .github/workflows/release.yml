name: release

# 仓库发布：推一个 v* tag（或在 Actions 里手动 dispatch）→ 构建 → 门禁 → 打包 → 发 Release → 发 Release → 更新项目站通道（gh-pages 的 index.json + 包体）。
# 2026-10-17 裁决：**用户站根那条通道删掉**（原「用户站根」步骤 + CHANNEL_TOKEN）。原因：它要推的
#   SunsetRNE/SunsetRNE.github.io 仓库根本不存在，v1.11.5 / v1.11.6 两次发布都在那一步红（clone 128），
#   而真正的更新路径是 GitHub Release（插件管理器读 releases/latest，见 ~/.dsh/plugin-sources.json），
#   项目站通道也照旧在发。少一条通道不影响发布，也不再让每次发布挂一条假红。
# 纪律：本地改产物不算数，一切以这一次工作流的产物为准。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本（不带 v，需与 package.json 一致）
        required: true

permissions:
  contents: write

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # 上界。此前没有它，一次卡住可以烧到 GitHub 默认的 6 小时 —— 2026-10-13 v1.8.1
    # 首次发布实测：门禁一步静默 20 分钟，只能人工取消。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: 安装依赖（只装依赖，构建一律显式跑）
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: 版本闸门（tag 与 package.json 必须一致；手动 dispatch 用输入值）
        run: |
          node -e "const v=require('./package.json').version;const isTag=process.env.GITHUB_REF_TYPE==='tag';const t=isTag?(process.env.GITHUB_REF_NAME||'').replace(/^v/,''):'${{ inputs.version }}';if(t&&v!==t){console.error('期望='+t+' package.json='+v);process.exit(1)}console.log('版本一致：'+v)"

      - name: 构建
        run: npm run build

      - name: 门禁 · 契约与合并期测试
        # 为什么加这一段：此前发布路径只跑 check:entries 与 tests/merge，而 package.json 里
        # verify:resident 串的那 8 个根 verify 件**全都不在发布路径上** —— 也就是说，发布一个版本
        # 可以完全绕开本仓自称的「认证」。这里把它接上（resident 半边在下面逐件成步）。
        # 注：verify:deck（deck 半边 310 道）**暂不接** —— 它有一批环境相关的存量红
        # （例如 verify-deck-tools-agent-register 要 deck/node_modules/@deepseek-ai/dsh-tools，
        # 而 deck 子树没有自己的 node_modules），接上会让发布直接红。清完存量红再单独接一行。
        timeout-minutes: 10
        run: |
          npm run check:entries
          node tests/merge/run.mjs

      # resident 半边 8 件**逐件成步**。为什么拆：原来是一步跑 `npm run verify:resident`，
      # 卡住时 CI 上只看到「门禁」这一步一直不动，连卡在哪一件都不知道 —— 2026-10-13
      # v1.8.1 首次发布实测：整条链在门禁里静默 20 分钟，无从定位，最后只能取消。
      # 拆开后每件各有 started_at/completed_at 与自己的上界（GitHub API 就能读出逐件耗时），
      # 红色直接落到具体文件上；某一件卡住也不再拖着其余七件一起无声等待。
      # 检查一条不少、一条不松：本机实测 2026-10-13（b81d682 之上的补丁）双环境 8/8 全绿 ——
      # 「无 gh 登录态」（CI 常态）与「本机有登录态」各跑一遍。
      - name: 门禁 · verify-bundle（打包契约）
        timeout-minutes: 6
        run: bash verify-bundle.sh

      - name: 门禁 · verify-logout（凭据拆除）
        timeout-minutes: 6
        run: node verify-logout.mjs

      - name: 门禁 · verify-registry（登记文件库）
        timeout-minutes: 6
        run: node verify-registry.mjs

      - name: 门禁 · verify-ui（界面）
        timeout-minutes: 6
        run: node verify-ui.mjs

      - name: 门禁 · verify-gh-bootstrap（自带 gh 落地）
        timeout-minutes: 6
        run: node verify-gh-bootstrap.mjs

      - name: 门禁 · verify-gh-system-layer（系统层）
        timeout-minutes: 6
        run: node verify-gh-system-layer.mjs

      - name: 门禁 · verify-update-gc（更新与 GC）
        timeout-minutes: 6
        run: node verify-update-gc.mjs

      - name: 门禁 · verify-real-artifact（官方真包）
        # 唯一打公网的一件：拉 api.github.com 元数据 + 下载官方 gh tarball。
        # 它在 CI 上到底行不行，2026-10-13 用一条诊断分支实测过（run 38441702733）：
        # runner 上 curl 直连官方资产 http=200 / 0.48 秒 / 15.3MB，本件连跑 3 次全绿、
        # 每次 1 秒（downloadAttempts 都是 1）。所以**严格保留**在发布门禁里是对的 ——
        # 本机偶发红是这台机器的出网问题（同一时刻 curl 三次 http=000），不是 CI 的问题。
        # 本件自己也带**有界重试**（见 verify-real-artifact.mjs）：元数据 fetch 30 秒上界，
        # 资产下载至多 3 次；拿不到真包仍判红，不静默跳过。
        # 上界给 12 分钟：重试 3 次 × 单次下载上限 180 秒 + 元数据 30 秒，留够空间让最坏情况
        # 也能跑完并**如实报出**「试了 3 次都拿不到」，而不是被这一步的上界先掐掉。
        timeout-minutes: 12
        run: node verify-real-artifact.mjs

      - name: 装载自检（不通过不许打包）
        run: node --input-type=module -e "import('./dist/host.js').then(()=>console.log('LOADED-OK'))"

      - name: 打包
        run: npm pack

      - name: 发布到 npm（配了 NPM_TOKEN 才执行）
        # 这一步决定「面板的安装更新」对本包是否成立：更新引擎 dsh-plugin-update 只在
        # profile 依赖 spec 是注册表型（^x.y.z / latest）时才判可更新；spec 是 URL 或 link:
        # 会判 source-install（面板显示「源码安装实例，不支持版本更新」，且不给手工命令）。
        # 没有 secret 时不失败、只如实说明后果 —— 不假装发布过。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "没有 NPM_TOKEN：跳过 npm 发布。"
            echo "后果：面板的「安装更新」只认注册表型安装；未发布时用户只能用 Release tgz 重装（README「安装」一节有命令）。"
            echo "开启方式：仓库 Settings → Secrets and variables → Actions 加 NPM_TOKEN（npm granular token，含 publish 权限）。"
            exit 0
          fi
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "npm 上已有 $PKG@$VER，跳过（幂等）"
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          npm publish --access public
          echo "已发布 $PKG@$VER 到 npm"

      - name: 发 Release（存在则覆盖资产）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TGZ=$(ls *.tgz | head -1)
          TAG=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo "v${{ inputs.version }}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TGZ" --clobber
          else
            gh release create "$TAG" "$TGZ" --title "$TAG" --generate-notes
          fi

      - name: 通道 · 项目站 gh-pages（包体 + index.json）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TGZ=$(ls *.tgz | head -1)
          VER=$(node -p "require('./package.json').version")
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/ch
          git clone --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ch
          node tools/channel/update-index.mjs --dir /tmp/ch --tgz "$PWD/$TGZ" --version "$VER" --ref "CI 发布 · ${GITHUB_SHA:0:7}"
          cd /tmp/ch
          git add -A
          git diff --cached --quiet || git commit -m "channel: $VER（CI 发布）"
          git push origin gh-pages
